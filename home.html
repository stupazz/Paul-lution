
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAUL LUTION</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
  
<nav class="navbar">
    <a class="logo" href="home.html">PAUL LUTION</a>
    <a class="mobile-logo" href="home.html">PL</a>
  
    <div class="nav-links">
      <a href="work.html">WORKS</a>
      <a href="about.html">ABOUT</a>
      <a href="tech-rider.html">TECH RIDER</a>

    </div>
  </nav>
  

  <main class="home-visual">
    <video id="myVideo" class="home-video"
    autoplay muted loop playsinline poster="VID/poster.jpg">
<source src="VID/Home.mp4" type="video/mp4">
</video>

    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">SOUND OFF</button>

    <div class="home-caption">
      <span>ELECTRONIC MUSIC / LIVE</span>
    </div>
  </main>
  <script>
    const v = document.getElementById("myVideo");
    const b = document.getElementById("soundToggle");
    b.addEventListener("click", () => {
      v.muted = !v.muted;
      if (!v.muted) v.play();
      b.textContent = v.muted ? "SOUND OFF" : "SOUND ON";
      b.setAttribute("aria-pressed", String(!v.muted));
    });
  </script>
</body>
</html>
